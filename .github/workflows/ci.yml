name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:

  codetest_build:
    name: Codetest & Build
    runs-on: ubuntu-latest
    steps:

      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: make get

      - name: Codetest
        run: make codetest

      - name: Build
        run: make build
