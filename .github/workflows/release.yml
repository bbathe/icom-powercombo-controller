name: Release
on:
  push:
    tags:
    - '*'
jobs:

  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Install mingw-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64

      - name: Set up Go 1.26
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Check out code
        uses: actions/checkout@v4

      - name: Get dependencies
        run: make get

      - name: Build
        run: make build

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: target/icom-powercombo-controller.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
